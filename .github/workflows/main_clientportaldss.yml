name: Build and deploy Python app to Azure Web App - clientportaldss

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - '.github/workflows/main_clientportaldss.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies (sanity build)
        run: |
          python -m venv antenv
          source antenv/bin/activate
          pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Package backend for deployment
        run: |
          cd backend
          zip -r ../release.zip . \
            -x "antenv/*" "venv/*" ".venv/*" "__pycache__/*" "*.pyc" \
               ".env" "*.db" "*.sqlite3" "uploads/*"

      - name: Upload artifact for deploy job
        uses: actions/upload-artifact@v4
        with:
          name: python-app
          path: release.zip

  deploy:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: python-app

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        id: deploy-to-webapp
        with:
          app-name: 'clientportaldss'
          slot-name: 'Production'
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_FFC542047A3647548BE67B61A4326B22 }}
          package: release.zip
